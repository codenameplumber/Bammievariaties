<body data-page="production">
  <main class="main-content" id="main">
    <div class="page-head">
      <div>
        <h1>Production list</h1>
        <p>Bake &amp; Cook pre-orders for the next 7 days: what to make, then each order. Tick an order when it's ready.</p>
      </div>
      <div class="page-actions"><button type="button" class="btn btn-outline-primary" data-print><i class="bi bi-printer me-1"></i>Print</button></div>
    </div>
    <nav class="filter-pills mb-3 no-print" aria-label="Jump to a day" data-days-nav></nav>
    <div class="d-grid gap-3" data-days><p class="text-muted">Loading…</p></div>
  </main>
