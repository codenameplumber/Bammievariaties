<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers | Bammie admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0F3D22">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../assets/img/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/img/brand/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script type="module" src="../assets/js/admin/customers.js"></script>
</head>
<body data-page="customers">
  <main class="main-content" id="main">
    <div class="page-head">
      <div>
        <h1>Customers</h1>
        <p>Everyone who has ordered with a phone number, from both stores. Your best customers come first.</p>
      </div>
      <div class="page-actions">
        <button type="button" class="btn btn-gold" data-copy-gifts><i class="bi bi-gift me-1"></i>Copy top 10 for gifts</button>
        <button type="button" class="btn btn-outline-primary" data-export="csv"><i class="bi bi-download me-1"></i>Export</button>
      </div>
    </div>
    <div class="row g-3 mb-3" data-stats></div>
    <section class="table-panel" aria-label="Customers">
      <table id="customersTable" class="table table-hover align-middle">
        <thead><tr><th>#</th><th>Customer</th><th>Phone</th><th>Orders</th><th>Total spent</th><th>Stores</th><th>Last order</th><th><span class="visually-hidden">Actions</span></th></tr></thead>
      </table>
    </section>
  </main>
  <div class="modal fade" id="customerModal" tabindex="-1" aria-labelledby="customerModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
      <div class="modal-content">
        <div class="modal-header"><h2 class="modal-title h5" id="customerModalTitle">Customer</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body" data-customer-body></div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>
</body>
</html>
